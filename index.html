<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="https://res.cloudinary.com/dzqdxosk2/image/upload/v1751885050/Raslipwani_Logo_qgwaen.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DNS prefetch for Supabase -->
    <link rel="dns-prefetch" href="https://supabase.co" />
    <!--
      Poppins is the font tailwind.config.js declares and the one the app actually
      uses. It is linked here rather than @import-ed from index.css so the browser
      can discover it in the initial HTML instead of after the CSS bundle parses.
    -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <title>Raslipwani Properties — Real Estate Across Kenya</title>

    <!--
      Applies the saved theme before the first paint.

      This has to be inline and blocking. React mounts after the browser has
      already painted, so a theme applied in an effect arrives a frame late and
      every page load flashes white at someone who chose dark. The storage key
      and the class are the same ones src/contexts/ThemeContext.jsx uses; that
      provider is the authority from mount onwards, this is only the first frame.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('raslipwani:theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Blocked storage or no matchMedia: the light default is already correct. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
